<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과제 제출함 - 핸드볼 수업</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="container">
            <a href="index.html">🏠 홈</a>
            <a href="quiz.html">퀴즈</a>
            <a href="submit.html">과제 제출</a>
        </div>
    </nav>
    <main class="container">
        <h1 class="section-title">핸드볼 20단계 마스터 과제 제출함</h1>
        <div id="submit-list"></div>
        <button onclick="window.print()" class="print-btn" style="margin-top:20px;">인증 결과 인쇄/PDF 저장</button>
    </main>

    <script>
        const list = document.getElementById('submit-list');
        for(let i=0; i<20; i++) {
            const code = localStorage.getItem('hb-code-'+i);
            const div = document.createElement('div');
            div.className = 'submission-card';
            div.innerHTML = `<span>${i+1}단계: ${code || '미완료'}</span> 
                             <span class="status-badge ${code ? 'status-done' : 'status-wait'}">${code ? '완료' : '미제출'}</span>`;
            list.appendChild(div);
        }
    </script>
</body>
</html>
